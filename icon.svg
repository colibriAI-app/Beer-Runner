<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- fond -->
  <rect width="512" height="512" rx="112" fill="#0b1220"/>
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="256" cy="256" r="216" fill="url(#halo)"/>

  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="biere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="verre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e2e8f0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="mousse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- poignée -->
  <path d="M366 208 h34 a44 44 0 0 1 0 88 h-34 v-30 h30 a14 14 0 0 0 0-28 h-30 z"
        fill="none" stroke="#e2e8f0" stroke-opacity="0.6" stroke-width="14" stroke-linejoin="round"/>

  <!-- corps du verre -->
  <path d="M156 150 L176 424 a20 20 0 0 0 20 18 h120 a20 20 0 0 0 20-18 L356 150 Z"
        fill="url(#verre)"/>
  <!-- bière -->
  <path d="M164 214 L180 420 a18 18 0 0 0 18 16 h116 a18 18 0 0 0 18-16 L348 214 Z"
        fill="url(#biere)"/>
  <!-- reflet vertical -->
  <rect x="204" y="228" width="18" height="168" rx="9" fill="#ffffff" opacity="0.35"/>

  <!-- bulles -->
  <circle cx="248" cy="330" r="9" fill="#ffffff" opacity="0.25"/>
  <circle cx="290" cy="300" r="7" fill="#ffffff" opacity="0.2"/>
  <circle cx="266" cy="382" r="6" fill="#ffffff" opacity="0.18"/>
  <circle cx="316" cy="360" r="8" fill="#ffffff" opacity="0.15"/>
  <circle cx="226" cy="272" r="6" fill="#ffffff" opacity="0.22"/>

  <!-- mousse qui déborde -->
  <ellipse cx="256" cy="150" rx="112" ry="40" fill="url(#mousse)"/>
  <circle cx="180" cy="132" r="30" fill="url(#mousse)"/>
  <circle cx="236" cy="116" r="36" fill="url(#mousse)"/>
  <circle cx="300" cy="124" r="30" fill="url(#mousse)"/>
  <circle cx="342" cy="148" r="22" fill="url(#mousse)"/>
  <ellipse cx="256" cy="162" rx="100" ry="22" fill="url(#mousse)"/>

  <!-- éclat de bulle au-dessus -->
  <circle cx="256" cy="66" r="10" fill="#fbbf24" opacity="0.85"/>
  <circle cx="300" cy="52" r="6" fill="#fbbf24" opacity="0.6"/>
  <circle cx="216" cy="46" r="5" fill="#fbbf24" opacity="0.5"/>
</svg>
